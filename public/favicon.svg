<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="fd-bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#282147"/>
      <stop offset="52%" stop-color="#1E1A33"/>
      <stop offset="100%" stop-color="#151324"/>
    </linearGradient>
    <radialGradient id="fd-glow-iris" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(132 118) rotate(42) scale(330 310)">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#6D62E8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6D62E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fd-glow-warm" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(392 396) rotate(-135) scale(280 260)">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fd-wave" x1="145" y1="194" x2="302" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A9A1FF"/>
      <stop offset="100%" stop-color="#F6F3FF"/>
    </linearGradient>
    <linearGradient id="fd-check" x1="148" y1="292" x2="364" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="68%" stop-color="#F7F5FF"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="fd-sun" x1="334" y1="132" x2="380" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="52%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <!-- Yuvarlatılmış Uygulama İkonu Zemini -->
  <rect width="512" height="512" rx="116" fill="url(#fd-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#fd-glow-iris)"/>
  <rect width="512" height="512" rx="116" fill="url(#fd-glow-warm)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" stroke="white" stroke-opacity="0.11" stroke-width="4"/>

  <!-- İnce Mimari Akış Çizgisi (Arka Plan İmzası) -->
  <path
    d="M 52 414 C 164 378, 294 446, 460 392"
    stroke="white"
    stroke-opacity="0.09"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- 1. Üst Akış Dalgası (Flow) -->
  <path
    d="M 146 196 C 194 146, 250 146, 298 178"
    stroke="url(#fd-wave)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- 2. Sıcak Gün Doğumu Noktası (Day) -->
  <circle cx="356" cy="158" r="25" fill="url(#fd-sun)"/>

  <!-- 3. Akıcı Onay / Tamamlama Kavisli Tik (Check-Flow) -->
  <path
    d="M 150 288 C 178 318, 204 346, 222 354 C 234 359, 245 354, 256 340 L 360 228"
    stroke="url(#fd-check)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
